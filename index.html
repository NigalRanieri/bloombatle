
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BloomBat-le</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<h1 class="game-title">
    <img src="assets/title.png" alt="BloomBat-le">
</h1>


<div id="navigation">
    <button id="previous">← Previous</button>
    <span id="puzzle-number"></span>
    <button id="next">Next →</button>
</div>

<div id="puzzle-selector"></div>

<div id="score">0 torches placed</div>
<div id="progress">0 / 10 solved</div>

<dialog id="statistics-dialog">
    <section id="statistics">
        <h2>Gauntlet Complete!</h2>
        <p id="statistics-summary"></p>
        <div id="score-histogram"></div>
        <div id="next-gauntlet">
            <div class="next-gauntlet-label">Next Gauntlet in</div>
            <div id="gauntlet-countdown">--:--:--</div>
        </div>
    </section>
</dialog>

<div id="board"></div>


<p id="status">Place two torches to solve the puzzle.</p>

<script src="puzzle.js"></script>
<script src="game.js"></script>
</body>
</html>
